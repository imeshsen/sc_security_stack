services:
  sonarqube_community:
    image: sonarqube:communityV1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonarqube_community
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://db:5432/sonarqube
      - SONARQUBE_JDBC_USERNAME=admin
      - SONARQUBE_JDBC_PASSWORD=1234
    networks:
      - sonarqube
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13
    container_name: sonarqube_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_db_data:

networks:
  sonarqube:
    name: sonarqube_network
